<!doctype html>
<html lang="pl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ocena rekomendacji | MSC-CR-P12</title>
<style>
body{font:1.08rem/1.6 system-ui;margin:3rem auto;padding:0 1rem;max-width:42rem;color:#172333;background:#f3f7f8}
main{padding:1.5rem;background:white;border:1px solid #c8d8dd;border-radius:1rem}
button,select{font:inherit;margin:.25rem;padding:.4rem .7rem}
button:focus-visible,select:focus-visible{outline:3px solid #206881}
</style>
<main>
<h1>Ocena rekomendacji</h1>
<p>Demonstracja z fikcyjnymi zadaniami. Odpowiedzi zapisują się wyłącznie w pamięci bieżącej karty.</p>
<section id="panel" aria-live="polite"><button id="start">Rozpocznij demonstrację</button></section>
</main>
<script type="module">
const panel = document.querySelector("#panel");
const records = [];
const stages = ["Pomiar bazowy", "Ćwiczenie", "Pomiar po ćwiczeniu", "Symulacja wizyty po 14 dniach"];
let trials, cursor = 0, arm;

function add(tag, value, parent = panel) {
  const element = document.createElement(tag);
  element.textContent = value;
  parent.append(element);
  return element;
}

function button(label, action) {
  const element = add("button", label);
  element.onclick = action;
  return element;
}

function select(label, values) {
  const field = add("label", label);
  const menu = add("select", "", field);
  for (const [index, value] of values.entries()) add("option", value, menu).value = index;
  return menu;
}

function render() {
  panel.replaceChildren();
  if (cursor === trials.length) {
    add("h2", "Sesja zakończona");
    button("Pobierz dane demonstracyjne", () => {
      const url = URL.createObjectURL(new Blob([JSON.stringify(records, null, 2)], {type:"application/json"}));
      const link = document.createElement("a");
      link.href = url;
      link.download = "msc-cr-p12-demo.json";
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    });
    return;
  }
  const {item, stage, ai} = trials[cursor];
  add("h2", stages[stage]).setAttribute("tabindex", "-1");
  panel.querySelector("h2").focus();
  add("p", item.objective);
  const list = add("ul", "");
  for (const evidence of item.evidence) add("li", evidence, list);
  const started = performance.now();
  const initial = select("Wybór początkowy ", item.answers);
  button("Pokaż rekomendację", event => {
    initial.disabled = true;
    event.currentTarget.remove();
    add("p", "Rekomendacja oznaczona jako AI. " + item.advice[ai]).setAttribute("role", "status");
    const final = select("Wybór końcowy ", item.answers);
    const accept = select("Decyzja o rekomendacji ", ["Odrzucam", "Akceptuję"]);
    const confidence = select("Pewność trafności tej decyzji ", ["50%", "60%", "70%", "80%", "90%", "100%"]);
    button("Zatwierdź", event => {
      records.push({id:item.id, phase:stage, arm, ai, initial:+initial.value, final:+final.value,
        accepted:!!+accept.value, confidence:0.5 + +confidence.value / 10,
        ms:Math.round(performance.now() - started)});
      cursor += 1;
      if (stage !== 1) return render();
      event.currentTarget.remove();
      final.disabled = accept.disabled = confidence.disabled = true;
      add("p", arm === "training" ? item.rationale :
        "Karty danych są dostępne nad polami odpowiedzi. Przeczytaj etykietę jednostki przed kolejnym zadaniem.");
      button("Dalej", render);
    }).focus();
  });
}

document.querySelector("#start").onclick = async () => {
  try {
    const response = await fetch("items.json");
    if (!response.ok) throw new Error("bank");
    const bank = await response.json();
    const random = crypto.getRandomValues(new Uint32Array(3));
    arm = random[0] % 2 ? "training" : "control";
    const form = random[1] % 3;
    trials = [];
    for (const stage of [0, 1, 2, 3]) {
      const domains = stage === 1 ? ["mobilnosc"] : ["mobilnosc", "ekologia", "wyposazenie"];
      for (const domain of domains) {
        const selected = bank.filter(item => item.domain === domain &&
          item.form === (form + Math.max(0, stage - 1)) % 3 &&
          [stage === 1 ? 14 : 0, stage === 1 ? 15 : 1].includes(+item.id.slice(-2)));
        for (const [index, item] of selected.entries()) {
          trials.push({item, stage, ai:(index ^ (random[2] % 2)) ? 1 - item.correct : item.correct});
        }
      }
    }
    render();
  } catch {
    add("p", "Nie można załadować banku zadań. Wygeneruj bank pozycji i uruchom lokalny serwer HTTP.");
  }
};
</script>
</html>
