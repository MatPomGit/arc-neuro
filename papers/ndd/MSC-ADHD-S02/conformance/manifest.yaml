schema_version: 1
paper_id: S02
status: active
reference_cases:
  - id: observed_recovery
    source: examples/recovery_event.observed.json
    expected_validator_outcome: accept
    scientific_state: recovery_observed
  - id: right_censored_recovery
    source: examples/recovery_event.censored.json
    expected_validator_outcome: accept
    scientific_state: right_censored
  - id: invalidated_measurement_context
    source: examples/recovery_event.invalid_context.json
    expected_validator_outcome: accept
    scientific_state: invalid_recovery_data_correctly_represented
negative_mutations:
  generated_by: scripts/generate_s02_conformance_report.py
  expected_validator_outcome: reject
  invariants:
    - required_field
    - terminal_state_exclusivity
    - challenge_eligibility
    - reference_context_identity
    - score_domain
    - timing_invariant
    - timing_qualification
ci_artifact:
  workflow: .github/workflows/research-contracts.yml
  artifact_name: s02-conformance-report
  files:
    - conformance_report.json
    - conformance_cases.csv
interpretation: "Conformance establishes structural and semantic auditability only; it does not validate the clinical or psychological meaning of recovery."
