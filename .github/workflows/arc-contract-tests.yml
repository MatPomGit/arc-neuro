name: ARC offline contract tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: arc-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    if: ${{ github.repository == 'MatPomGit/arc-neuro' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        revision: ${{ fromJSON(github.event_name == 'pull_request' && '["head","merge"]' || '["head"]') }}
    steps:
      - name: Checkout isolated PR revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.revision == 'head' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Verify exact checkout SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ matrix.revision == 'head' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "MatPomGit/arc-neuro"
          actual="$(git rev-parse HEAD)"
          printf 'Expected SHA: %s\nActual SHA: %s\n' "$EXPECTED_SHA" "$actual"
          test "$actual" = "$EXPECTED_SHA"
          python3 --version
      - name: Validate ARC contract
        shell: bash
        run: python3 -B scripts/validate_repository.py --phase scaffold
      - name: Verify optional programme branding
        run: python3 -B scripts/site_branding.py
      - name: Enforce Unicode budgets, public Pages and Issues/JUMP contracts
        shell: bash
        run: |
          python3 -B scripts/validate_documentation.py
          python3 -B scripts/validate_pages.py
          python3 -B scripts/validate_issues.py
      - name: Run offline unit tests
        shell: bash
        run: python3 -B -m unittest discover -s tests -v
      - name: Test synthetic ANX statistical reference in isolated venv
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/arc-neuro-anx-analysis"
          "${RUNNER_TEMP}/arc-neuro-anx-analysis/bin/python" -m pip install --disable-pip-version-check -r papers/cognition/MSC-ANX-P01/reference/requirements-ci.txt
          "${RUNNER_TEMP}/arc-neuro-anx-analysis/bin/python" -m pip check
          "${RUNNER_TEMP}/arc-neuro-anx-analysis/bin/python" -B -m unittest discover -s papers/cognition/MSC-ANX-P01/reference -p 'test_*.py' -v
      - name: Test CR-P12 signal detection, contrast and candidate bank
        run: |
          "${RUNNER_TEMP}/arc-neuro-anx-analysis/bin/python" -B -m unittest discover -s papers/cognition/MSC-CR-P12 -p 'test_*.py' -v
      - name: Test local ANX browser demo contract
        shell: bash
        run: |
          set -euo pipefail
          ref=papers/cognition/MSC-ANX-P01/reference
          python3 -B "$ref/export_demo.py" "${RUNNER_TEMP}/anx-demo.json" --seed 42
          node --check "$ref/browser_demo/app.mjs"
          ANX_DEMO_MANIFEST="${RUNNER_TEMP}/anx-demo.json" node --test "$ref/browser_demo/core.test.mjs"
      - name: Test ANX browser demo in local Chromium
        shell: bash
        run: |
          set -euo pipefail
          venv="${RUNNER_TEMP}/arc-neuro-anx-analysis"
          ANX_CHROME="$(command -v google-chrome)" "$venv/bin/python" -B papers/cognition/MSC-ANX-P01/reference/browser_demo/e2e.py -v
      - name: Test CR-P12 browser prototype in local Chromium
        shell: bash
        run: |
          venv="${RUNNER_TEMP}/arc-neuro-anx-analysis"
          ANX_CHROME="$(command -v google-chrome)" "$venv/bin/python" -B papers/cognition/MSC-CR-P12/browser_e2e.py
      - name: Record ANX environment provenance
        shell: bash
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/arc-neuro-anx-analysis/bin/python" -B papers/cognition/MSC-ANX-P01/reference/environment.py
      - name: Read-only v2 migration inventory preflight
        run: python3 -B scripts/migration_preflight.py
      - name: Verify public GitHub review evidence
        shell: bash
        run: python3 -B scripts/verify_public_reviews.py
      - name: Check public catalog is deterministic
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/build_public_catalog.py
          git diff --exit-code -- pages/projects.md
      - name: Compile all draft LaTeX files to isolated PDFs (not scientific validation)
        shell: bash
        run: |
          set -euo pipefail
          # The TeX packages come from Ubuntu. Keep third-party runner feeds out of this step.
          ubuntu_sources=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
          sudo apt-get "${ubuntu_sources[@]}" update -qq
          sudo apt-get "${ubuntu_sources[@]}" install -y -qq --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-lang-polish lmodern latexmk biber texlive-publishers texlive-latex-extra texlive-bibtex-extra texlive-pictures texlive-fonts-recommended
          python3 -B scripts/compile_manuscripts.py
      - name: Build curated MkDocs HTML and inspect emitted pages
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/arc-neuro-mkdocs"
          "${RUNNER_TEMP}/arc-neuro-mkdocs/bin/python" -m pip install --disable-pip-version-check mkdocs==1.6.1
          "${RUNNER_TEMP}/arc-neuro-mkdocs/bin/python" -m mkdocs build --strict --clean
          python3 -B scripts/verify_site_output.py site
