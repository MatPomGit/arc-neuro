  <marker id="arrow" markerWidth="10" markerHeight="10" refX="7.5" refY="5" orient="auto"><path d="M1,1 L8,5 L1,9" fill="none" stroke="#52748D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
