<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1460" height="1615" viewBox="0 0 1460 1615" role="img" aria-labelledby="prismaTitle prismaDesc">
<title id="prismaTitle">ARC-ADHD R01 — Preliminary PRISMA-style flow for the automated SciSpace export</title>
<desc id="prismaDesc">The supplied composite export contains 577 records. Automated title and abstract screening excluded 551 and advanced 26. The nominal next stage marked 23 records included despite missing full text and excluded three. Formal eligibility and included study counts are unknown. This is not a finalized PRISMA 2020 diagram.</desc>
